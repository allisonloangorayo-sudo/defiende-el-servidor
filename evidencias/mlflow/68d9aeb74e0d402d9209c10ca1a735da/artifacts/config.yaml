id: E4
nombre: hist_gradient_boosting
familia: arboles
semilla: 42
hipotesis: >
  Un ensemble de árboles por gradient boosting combina muchas reglas débiles y debería
  reducir la varianza de un único árbol. Esperamos la mejor curva recall-FPR de los cuatro
  experimentos y, por tanto, el mayor recall de ataque con FPR <= 5 % en validación.
cambio: Respecto a E3 se reemplaza el árbol único por un ensemble boosting con categorías nativas.
preprocesamiento:
  numericas: ninguno
  categoricas: ordinal
modelo:
  clase: HistGradientBoostingClassifier
  parametros:
    learning_rate: 0.1
    max_iter: 300
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    early_stopping: false
